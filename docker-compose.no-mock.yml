# ═══════════════════════════════════════════════════════════════════════
# ALL EXCEPT MOCK — UI + engine + 3 connectors on a shared network.
# Data comes from the real tenant API + the SQL/CSV connectors (no mock-api).
#
#   Usage:  docker compose -f docker-compose.no-mock.yml up -d --build
#   Prereq: .env.prod filled in (API_BASE_URL, USER_INFO_URL/SSO, ENGINE_API_KEY)
#   Ports:  UI 3001, engine 4001, connectors 4002/4003/4004.
#           Override host ports if taken, e.g. ENGINE_HOST_PORT=4011 docker compose -f ... up -d
# ═══════════════════════════════════════════════════════════════════════

services:
  engine:
    build: ./apps/engine
    ports:
      - "${ENGINE_HOST_PORT:-4001}:4001"
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - ENGINE_PORT=4001
      - UI_ORIGIN=http://localhost:${UI_HOST_PORT:-3001}
      - CONFIG_DIR=/app/data/config
      - TRAINING_DIR=/app/data/training
    volumes:
      - engine-data:/app/data
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mssql-connector:
    build: ./apps/mssql-connector
    ports:
      - "${MSSQL_HOST_PORT:-4002}:4002"
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - CONNECTOR_PORT=4002
      - UI_ORIGIN=http://localhost:${UI_HOST_PORT:-3001}
      - DATA_DIR=/app/data
    volumes:
      - mssql-data:/app/data
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  oracle-connector:
    build: ./apps/oracle-connector
    ports:
      - "${ORACLE_HOST_PORT:-4003}:4003"
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - CONNECTOR_PORT=4003
      - UI_ORIGIN=http://localhost:${UI_HOST_PORT:-3001}
      - DATA_DIR=/app/data
    volumes:
      - oracle-data:/app/data
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  csv-xlsx-connector:
    build: ./apps/csv-xlsx-connector
    ports:
      - "${CSV_HOST_PORT:-4004}:4004"
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - CONNECTOR_PORT=4004
      - UI_ORIGIN=http://localhost:${UI_HOST_PORT:-3001}
      - DATA_DIR=/app/data
    volumes:
      - csv-data:/app/data
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ui:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_WIJMO_LICENSE_KEY: ${NEXT_PUBLIC_WIJMO_LICENSE_KEY:-}
    ports:
      - "${UI_HOST_PORT:-3001}:3001"
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - ENGINE_URL=http://engine:4001
      - MSSQL_CONNECTOR_URL=http://mssql-connector:4002
      - ORACLE_CONNECTOR_URL=http://oracle-connector:4003
      - CSV_XLSX_CONNECTOR_URL=http://csv-xlsx-connector:4004
    depends_on:
      engine:
        condition: service_healthy
      mssql-connector:
        condition: service_healthy
      oracle-connector:
        condition: service_healthy
      csv-xlsx-connector:
        condition: service_healthy
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  chatbot:
    driver: bridge

volumes:
  engine-data:
  mssql-data:
  oracle-data:
  csv-data:
