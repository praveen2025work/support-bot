# ═══════════════════════════════════════════════════════════════════════
# FULL STACK (all 6) — UI + engine + mock-api + 3 connectors, on a shared
# network. Uses MOCK / demo data (.env.demo) — works out of the box, no secrets.
#
#   Usage:  docker compose -f docker-compose.full.yml up -d --build
#   Ports:  UI 3001, engine 4001, mock-api 8080, connectors 4002/4003/4004.
#           Override host ports if taken (common on a dev box), e.g.:
#           MOCK_HOST_PORT=8088 ENGINE_HOST_PORT=4011 docker compose -f docker-compose.full.yml up -d
# ═══════════════════════════════════════════════════════════════════════

services:
  mock-api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/mock-api:/app
    command: sh -c "npm ci --omit=dev 2>/dev/null; npm start"
    ports:
      - "${MOCK_HOST_PORT:-8080}:8080"
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  engine:
    build: ./apps/engine
    ports:
      - "${ENGINE_HOST_PORT:-4001}:4001"
    env_file: .env.demo
    environment:
      - NODE_ENV=production
      - ENGINE_PORT=4001
      - API_BASE_URL=http://mock-api:8080/api
      - UI_ORIGIN=http://localhost:${UI_HOST_PORT:-3001}
      - CONFIG_DIR=/app/data/config
      - TRAINING_DIR=/app/data/training
    depends_on:
      mock-api:
        condition: service_healthy
    volumes:
      - demo-engine-data:/app/data
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mssql-connector:
    build: ./apps/mssql-connector
    ports:
      - "${MSSQL_HOST_PORT:-4002}:4002"
    environment:
      - NODE_ENV=production
      - CONNECTOR_PORT=4002
      - UI_ORIGIN=http://localhost:${UI_HOST_PORT:-3001}
      - DATA_DIR=/app/data
    volumes:
      - demo-mssql-data:/app/data
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  oracle-connector:
    build: ./apps/oracle-connector
    ports:
      - "${ORACLE_HOST_PORT:-4003}:4003"
    environment:
      - NODE_ENV=production
      - CONNECTOR_PORT=4003
      - UI_ORIGIN=http://localhost:${UI_HOST_PORT:-3001}
      - DATA_DIR=/app/data
    volumes:
      - demo-oracle-data:/app/data
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  csv-xlsx-connector:
    build: ./apps/csv-xlsx-connector
    ports:
      - "${CSV_HOST_PORT:-4004}:4004"
    environment:
      - NODE_ENV=production
      - CONNECTOR_PORT=4004
      - UI_ORIGIN=http://localhost:${UI_HOST_PORT:-3001}
      - DATA_DIR=/app/data
    volumes:
      - demo-csv-data:/app/data
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ui:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_WIJMO_LICENSE_KEY: ${NEXT_PUBLIC_WIJMO_LICENSE_KEY:-}
    ports:
      - "${UI_HOST_PORT:-3001}:3001"
    env_file: .env.demo
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - ENGINE_URL=http://engine:4001
      - MSSQL_CONNECTOR_URL=http://mssql-connector:4002
      - ORACLE_CONNECTOR_URL=http://oracle-connector:4003
      - CSV_XLSX_CONNECTOR_URL=http://csv-xlsx-connector:4004
    depends_on:
      engine:
        condition: service_healthy
      mssql-connector:
        condition: service_healthy
      oracle-connector:
        condition: service_healthy
      csv-xlsx-connector:
        condition: service_healthy
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  chatbot:
    driver: bridge

volumes:
  demo-engine-data:
  demo-mssql-data:
  demo-oracle-data:
  demo-csv-data:
