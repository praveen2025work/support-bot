name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new commit lands;
# keeps the queue snappy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint + Next.js typecheck + unit tests ─────────────────────────────────
  lint-and-test:
    name: Next.js lint + tsc + jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --passWithNoTests

  # ── Production build sanity check ────────────────────────────────────────
  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  # ── Engine typecheck + vitest ─────────────────────────────────────────────
  engine:
    name: Engine tsc + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/engine/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # ── Typecheck engine-integration tests ───────────────────────────────────
  # tests/nlp and tests/learning import engine source (which uses the engine's
  # `@/*` alias) and are therefore excluded from both the root and engine
  # tsconfigs. This job typechecks them with `@/* -> services/engine/src` so
  # type errors in those tests (e.g. a wrong constructor arg) can't hide.
  # Needs root deps (@types/jest) AND engine deps (ml-matrix, natural, …).
  engine-tests-typecheck:
    name: Engine-integration tests tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install root deps
        run: npm ci
      - name: Install engine deps
        working-directory: services/engine
        run: npm ci
      - name: Typecheck engine-integration tests
        run: npm run typecheck:tests-engine

  # ── End-to-end validation harness ────────────────────────────────────────
  # Boots mock-api + engine + Next.js, then runs the 125-check
  # validation suite that lives in scripts/demo/validate.mjs. Any
  # red harness check fails this job — the same harness operators
  # run pre-deploy.
  validation-harness:
    name: Validation harness (125 checks)
    runs-on: ubuntu-latest
    needs: [lint-and-test, engine]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root deps (Next.js)
        run: npm ci

      - name: Install engine deps
        working-directory: services/engine
        run: npm ci

      - name: Install mock-api deps
        working-directory: services/mock-api
        run: npm ci

      - name: Boot mock-api
        working-directory: services/mock-api
        run: |
          nohup node server.js > /tmp/mock-api.log 2>&1 &
          echo $! > /tmp/mock-api.pid

      - name: Boot engine + Next.js
        run: |
          nohup npm run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid

      - name: Wait for all services to be ready
        run: |
          # mock-api
          for i in {1..30}; do
            curl -fs http://localhost:8080/ > /dev/null 2>&1 && echo "mock-api ready" && break
            sleep 2
          done
          # engine
          for i in {1..60}; do
            curl -fs http://localhost:4001/api/health > /dev/null 2>&1 && echo "engine ready" && break
            sleep 2
          done
          # next.js
          for i in {1..90}; do
            curl -fs -o /dev/null http://localhost:3001 2>/dev/null && echo "next.js ready" && break
            sleep 2
          done

      - name: Run validation harness
        run: npm run validate:demo

      - name: Upload demo validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-validation-report
          path: docs/DEMO-VALIDATION.md
          if-no-files-found: warn

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            /tmp/mock-api.log
            /tmp/dev.log
          if-no-files-found: warn

      - name: Tear down services
        if: always()
        run: |
          kill $(cat /tmp/dev.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/mock-api.pid 2>/dev/null) 2>/dev/null || true
