name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new commit lands;
# keeps the queue snappy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Web (UI): lint + Next.js typecheck + jest ─────────────────────────────
  web:
    name: Web lint + tsc + jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --passWithNoTests

  # ── Design assets: extracted CSS / icons / fonts stay in sync ───────────
  design-assets:
    name: Design assets kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: node --test packages/design-assets/test/kit.test.mjs

  # ── Web production build sanity check ────────────────────────────────────
  build:
    name: Web production build
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── Engine: typecheck + vitest (unit) + jest (integration) ───────────────
  engine:
    name: Engine tsc + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/engine/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # ── Typecheck engine-integration tests ───────────────────────────────────
  # apps/engine/tests/{nlp,learning,…} import engine source (which uses the
  # engine's `@/*` alias) and are excluded from the engine's main tsconfig.
  # This job typechecks them via apps/engine/tsconfig.tests.json so type errors
  # in those tests (e.g. a wrong constructor arg) can't hide.
  engine-tests-typecheck:
    name: Engine-integration tests tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/engine/package-lock.json
      - run: npm ci
      - run: npm run typecheck:tests

  # ── Data connectors: lint + typecheck + tests ────────────────────────────
  # mssql / oracle / csv-xlsx are standalone Node/TS services (not workspaces),
  # so each installs and verifies independently via a matrix. fail-fast: false
  # so one connector's failure doesn't mask the others.
  connectors:
    name: Connectors lint + tsc + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        connector: [mssql-connector, oracle-connector, csv-xlsx-connector]
    defaults:
      run:
        working-directory: apps/${{ matrix.connector }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22: the connectors' test script (tsx --test "src/**/*.test.ts")
          # relies on node:test glob support, which only exists on Node 21+.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/${{ matrix.connector }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build:typecheck
      - run: npm test

  # ── End-to-end validation harness ────────────────────────────────────────
  # Boots mock-api + engine + Next.js, then runs the validation suite in
  # scripts/demo/validate.mjs. Any red harness check fails this job — the same
  # harness operators run pre-deploy.
  validation-harness:
    name: Validation harness (125 checks)
    runs-on: ubuntu-latest
    needs: [web, engine]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root deps (orchestration)
        run: npm ci

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Install engine deps
        working-directory: apps/engine
        run: npm ci

      - name: Install mock-api deps
        working-directory: apps/mock-api
        run: npm ci

      - name: Boot mock-api
        working-directory: apps/mock-api
        run: |
          nohup node server.js > /tmp/mock-api.log 2>&1 &
          echo $! > /tmp/mock-api.pid

      - name: Boot engine + Next.js
        run: |
          nohup npm run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid

      - name: Wait for all services to be ready
        run: |
          # mock-api
          for i in {1..30}; do
            curl -fs http://localhost:8080/ > /dev/null 2>&1 && echo "mock-api ready" && break
            sleep 2
          done
          # engine
          for i in {1..60}; do
            curl -fs http://localhost:4001/api/health > /dev/null 2>&1 && echo "engine ready" && break
            sleep 2
          done
          # next.js
          for i in {1..90}; do
            curl -fs -o /dev/null http://localhost:3001 2>/dev/null && echo "next.js ready" && break
            sleep 2
          done

      - name: Run validation harness
        run: npm run validate:demo

      - name: Upload demo validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-validation-report
          path: docs/DEMO-VALIDATION.md
          if-no-files-found: warn

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            /tmp/mock-api.log
            /tmp/dev.log
          if-no-files-found: warn

      - name: Tear down services
        if: always()
        run: |
          kill $(cat /tmp/dev.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat /tmp/mock-api.pid 2>/dev/null) 2>/dev/null || true
