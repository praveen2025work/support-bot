# ═══════════════════════════════════════════════════════
# UAT — UI + Engine (+ connectors), mirrors prod.
# Real UAT-tenant APIs provide the data endpoints. No Mock API.
# Usage: docker compose -f docker-compose.uat.yml up
# Prereq: copy .env.uat and fill in your UAT values.
# ═══════════════════════════════════════════════════════

services:
  # ── Service 1: UI (Next.js frontend) ──
  ui:
    build:
      context: .
      args:
        NEXT_PUBLIC_WIJMO_LICENSE_KEY: ${NEXT_PUBLIC_WIJMO_LICENSE_KEY:-}
    ports:
      - "3001:3001"
    env_file: .env.uat
    environment:
      - ENGINE_URL=http://engine:4001
      - MSSQL_CONNECTOR_URL=http://mssql-connector:4002
      - ORACLE_CONNECTOR_URL=http://oracle-connector:4003
      - CSV_XLSX_CONNECTOR_URL=http://csv-xlsx-connector:4004
    depends_on:
      engine:
        condition: service_healthy
      mssql-connector:
        condition: service_healthy
      oracle-connector:
        condition: service_healthy
      csv-xlsx-connector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://$$(hostname -i):3001/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Service 2: Engine (NLP + Query Execution + Admin API) ──
  engine:
    build: ./services/engine
    ports:
      - "4001:4001"
    env_file: .env.uat
    environment:
      - UI_ORIGIN=http://ui:3001
      # Persistent, writable config on the engine-data volume (uid 1001 owns it).
      # All config is file-based — groups (groups.json) + NLP corpus/faq
      # (training/); per-group query files live under DATA_DIR/queries. No db.json.
      # Seed these once from the image's baked src/config + src/training.
      - CONFIG_DIR=/app/data/config
      - TRAINING_DIR=/app/data/training
    volumes:
      - uat-engine-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://$$(hostname -i):4001/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Service 3: MSSQL Connector (SQL Server data sources) ──
  mssql-connector:
    build:
      context: .
      dockerfile: services/connector.Dockerfile
      args:
        SERVICE_DIR: services/mssql-connector
        SERVICE_PORT: 4002
    ports:
      - "4002:4002"
    env_file: .env.uat
    environment:
      - CONNECTOR_PORT=4002
      - UI_ORIGIN=http://ui:3001
      - DATA_DIR=/app/data
    volumes:
      - uat-mssql-connector-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://$$(hostname -i):4002/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Service 4: Oracle Connector (Oracle data sources) ──
  oracle-connector:
    build:
      context: .
      dockerfile: services/connector.Dockerfile
      args:
        SERVICE_DIR: services/oracle-connector
        SERVICE_PORT: 4003
    ports:
      - "4003:4003"
    env_file: .env.uat
    environment:
      - CONNECTOR_PORT=4003
      - UI_ORIGIN=http://ui:3001
      - DATA_DIR=/app/data
    volumes:
      - uat-oracle-connector-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://$$(hostname -i):4003/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Service 5: CSV/XLSX Connector (file and Excel data sources) ──
  csv-xlsx-connector:
    build:
      context: .
      dockerfile: services/connector.Dockerfile
      args:
        SERVICE_DIR: services/csv-xlsx-connector
        SERVICE_PORT: 4004
    ports:
      - "4004:4004"
    env_file: .env.uat
    environment:
      - CONNECTOR_PORT=4004
      - UI_ORIGIN=http://ui:3001
      - DATA_DIR=/app/data
    volumes:
      - uat-csv-xlsx-connector-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://$$(hostname -i):4004/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  uat-engine-data:
  uat-mssql-connector-data:
  uat-oracle-connector-data:
  uat-csv-xlsx-connector-data:
