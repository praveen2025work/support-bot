# ═══════════════════════════════════════════════════════════════════════
# UI + ENGINE only — the minimal pair on a shared network.
# Data comes from the real tenant API (no mock-api, no connectors).
#
#   Usage:  docker compose -f docker-compose.ui-engine.yml up -d --build
#   Prereq: .env.prod filled in (API_BASE_URL, USER_INFO_URL/SSO, ENGINE_API_KEY)
#   Ports:  UI 3001, engine 4001. If taken, override the HOST side:
#           UI_HOST_PORT=3011 ENGINE_HOST_PORT=4011 docker compose -f docker-compose.ui-engine.yml up -d
# ═══════════════════════════════════════════════════════════════════════

services:
  engine:
    build: ./apps/engine
    ports:
      - "${ENGINE_HOST_PORT:-4001}:4001"
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - ENGINE_PORT=4001
      - UI_ORIGIN=http://localhost:${UI_HOST_PORT:-3001}
      - CONFIG_DIR=/app/data/config
      - TRAINING_DIR=/app/data/training
    volumes:
      - engine-data:/app/data
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ui:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_WIJMO_LICENSE_KEY: ${NEXT_PUBLIC_WIJMO_LICENSE_KEY:-}
    ports:
      - "${UI_HOST_PORT:-3001}:3001"
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - ENGINE_URL=http://engine:4001
    depends_on:
      engine:
        condition: service_healthy
    networks:
      - chatbot
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  chatbot:
    driver: bridge

volumes:
  engine-data:
