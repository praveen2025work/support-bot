# ═══════════════════════════════════════════════════════
# DEMO MODE — all 3 services
# Usage: docker compose up
# ═══════════════════════════════════════════════════════

services:
  # ── Service 1: UI (Next.js frontend) ──
  ui:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - ENGINE_URL=http://engine:4001
    depends_on:
      - engine
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://$$(hostname -i):3001/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Service 2: Engine (NLP + Query Execution + Admin API) ──
  engine:
    build: ./services/engine
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - ENGINE_PORT=4001
      - API_BASE_URL=http://mock-api:8080/api
      - UI_ORIGIN=http://ui:3001
      # No USER_INFO_URL → mock user fallback
      # No ENGINE_API_KEY → open admin access (demo only)
    depends_on:
      - mock-api
    volumes:
      - engine-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://$$(hostname -i):4001/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Optional: MSSQL Connector (no-code SQL APIs) ──
  # mssql-connector:
  #   build:
  #     context: .
  #     dockerfile: services/connector.Dockerfile
  #     args:
  #       SERVICE_DIR: services/mssql-connector
  #       SERVICE_PORT: 4002
  #   ports:
  #     - '4002:4002'
  #   environment:
  #     - CONNECTOR_PORT=4002
  #     - CONNECTOR_API_KEY=change-me
  #   volumes:
  #     - mssql-connector-data:/app/data
  #   restart: unless-stopped

  # ── Optional: Oracle Connector (no-code SQL APIs) ──
  # oracle-connector:
  #   build:
  #     context: .
  #     dockerfile: services/connector.Dockerfile
  #     args:
  #       SERVICE_DIR: services/oracle-connector
  #       SERVICE_PORT: 4003
  #   ports:
  #     - '4003:4003'
  #   environment:
  #     - CONNECTOR_PORT=4003
  #     - CONNECTOR_API_KEY=change-me
  #   volumes:
  #     - oracle-connector-data:/app/data
  #   restart: unless-stopped

  # ── Optional: CSV/XLSX Connector (file and Excel data sources) ──
  # csv-xlsx-connector:
  #   build:
  #     context: .
  #     dockerfile: services/connector.Dockerfile
  #     args:
  #       SERVICE_DIR: services/csv-xlsx-connector
  #       SERVICE_PORT: 4004
  #   ports:
  #     - '4004:4004'
  #   environment:
  #     - CONNECTOR_PORT=4004
  #     - CONNECTOR_API_KEY=change-me
  #   volumes:
  #     - csv-xlsx-connector-data:/app/data
  #   restart: unless-stopped

  # ── Service 3: Mock API (sample data — demo only) ──
  mock-api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./services/mock-api:/app
    command: sh -c "npm ci --omit=dev 2>/dev/null; npm start"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  engine-data:
  mssql-connector-data:
  oracle-connector-data:
  csv-xlsx-connector-data:
